<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIME — Digital Clock | Abdul Saboor Malik</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="noise"></div>

    <main class="clock-wrapper">

        <section class="clock-card">

            <header class="top-bar">
                <span class="brand">TIME.</span>

                <span class="status">
                    <span class="status-dot"></span>
                    LIVE
                </span>
            </header>

            <div class="content">

                <p class="eyebrow">THE ART OF TIME</p>

                <h1 class="clock" id="clock">
                    00:00:00
                </h1>

                <div class="period" id="period">
                    AM
                </div>

                <div class="divider"></div>

                <p class="date" id="date">
                    Loading date...
                </p>

                <p class="timezone">
                    LOCAL TIME • PAKISTAN
                </p>

            </div>

            <footer class="bottom-bar">
                <span>EST. 2026</span>

                <span class="monogram">ASM</span>

                <span>SPIRΞX / 06</span>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
